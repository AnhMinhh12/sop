station_id: "04"
station_name: "Station 04 - Máy 4 (TK_1A00-V0022)"

# ĐỊNH NGHĨA CÁC VÙNG ĐA GIÁC (POLYGONS)
zones:
  # Khuôn dập / mâm xoay (ở góc dưới bên phải màn hình)
  mold: [[0.417, 0.621], [0.556, 0.343], [0.809, 0.593], [0.666, 0.961]]
  # Khung nhỏ tâm khuôn: vị trí sản phẩm nhựa đen nhô lên sau khi ép xong
  product_popup: [[0.54, 0.49], [0.66, 0.49], [0.66, 0.63], [0.54, 0.63]]
  # Bàn giữa (hộp chứa 2 linh kiện hạt tròn/bi nhỏ)
  middle_table: [[0.34, 0.671], [0.241, 0.54], [0.39, 0.247], [0.503, 0.372]]
  # Nút bấm an toàn bên trái
  button_left: [[0.472, 0.317], [0.536, 0.246], [0.597, 0.303], [0.509, 0.378]]
  # Nút bấm an toàn bên phải
  button_right: [[0.216, 0.821], [0.249, 0.667], [0.316, 0.671], [0.266, 0.871]]
  # Vùng tham chiếu chọn tay thao tác
  work_area: [[0.038, 0.632], [0.447, 0.085], [0.881, 0.531], [0.632, 0.985]]

# QUY TRÌNH SOP CHI TIẾT (3 BƯỚC CHO MÃ HÀNG TK_1A00-V0022)
steps:
  # Bước 1: Lấy sản phẩm ra khỏi khuôn
  - step_order: 1
    step_name: "Lấy sản phẩm ra khỏi khuôn"
    logic: "zone_trigger"
    active_hand: "any"
    required_zone: "mold"
    min_dwell_sec: 0.3

  # Bước 2: Lắp 2 linh kiện vào khuôn (lấy từ bàn giữa, lắp đủ 2 lần vào khuôn)
  - step_order: 2
    step_name: "Lắp 2 linh kiện vào khuôn"
    logic: "multi_trigger"
    active_hand: "any"
    source_zone: "middle_table"
    required_zone: "mold"
    required_count: 2
    min_dwell_sec: 0.25

  # Bước 3: 2 tay đồng thời bấm 2 nút khởi động mâm xoay 180 độ
  - step_order: 3
    step_name: "2 tay đồng thời bấm 2 nút"
    logic: "dual_task"
    left_zone: "button_left"
    right_zone: "button_right"
    min_dwell_sec: 0.25
    max_button_delay_sec: 0.6

config:
  violation_tolerance: 8
  idle_timeout_frames: 120
  transition_timeout_sec: 60.0
  min_step_dwell_sec: 0.15
  restart_allowed_until_step: 1
  max_cycle_time_sec: 60.0

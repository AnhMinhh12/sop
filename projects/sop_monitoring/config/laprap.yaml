station_id: "machine_08"
station_name: "Máy IN-HOT-LAPRAP - laprap"
target_screws: 8
missing_dwell_sec: 4.5
max_cycle_time_sec: 35.0

# ĐỊNH NGHĨA 2 VÙNG ROI: VÙNG CẤT (TRÁI) VÀ VÙNG LẤY (PHẢI)
zones:
  vung_cat: [[0.02, 0.11], [0.36, 0.11], [0.36, 0.94], [0.02, 0.94]]
  vung_lay: [[0.60, 0.18], [0.97, 0.18], [0.97, 0.94], [0.60, 0.94]]

# CÁC BƯỚC THEO DÕI TRÊN GIAO DIỆN WEB DASHBOARD
steps:
  - step_order: 1
    step_name: "Lấy phôi chi tiết (Khay phải)"
    step_label: "step_pick_part"
    required_zone: "vung_lay"
    target_screws: 0
  - step_order: 2
    step_name: "Lắp ốc vị trí 1 - 2"
    step_label: "step_screw_1_2"
    target_screws: 2
  - step_order: 3
    step_name: "Lắp ốc vị trí 3 - 4"
    step_label: "step_screw_3_4"
    target_screws: 4
  - step_order: 4
    step_name: "Lắp ốc vị trí 5 - 6"
    step_label: "step_screw_5_6"
    target_screws: 6
  - step_order: 5
    step_name: "Lắp ốc vị trí 7 - 8"
    step_label: "step_screw_7_8"
    target_screws: 8
  - step_order: 6
    step_name: "Hoàn tất & Cất chi tiết (Khay trái)"
    step_label: "step_finish"
    required_zone: "vung_cat"
    target_screws: 8

config:
  w: 1280
  h: 720
  min_dwell_sec: 0.3
  max_cycle_time_sec: 21.00

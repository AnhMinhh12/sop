station_id: "machine_07"
station_name: "Station 07 - Máy 7 (TFF4040)"

# CẤU HÌNH BỘ ĐẾM SẢN PHẨM DÙNG CHUNG (UNIVERSAL COUNTER)
production_counter:
  enabled: true
  products_per_cycle: 2               # Định mức: +2 sản phẩm mỗi lần xoay mâm
  trigger_mode: "single_button"        # Ấn 1 nút bên phải
  button_zones: ["button_right"]
  motion_verify_zone: "mold"           # Kiểm tra chuyển động mâm xoay ở vùng khuôn
  verify_timeout_seconds: 2.5         # Chờ mâm xoay trong 2.5s sau khi ấn nút
  cooldown_seconds: 5.0               # Khóa chống đếm đúp trong 5.0s
  motion_threshold: 0.05              # Ngưỡng pixel chuyển động tối thiểu 5%

# ĐỊNH NGHĨA CÁC VÙNG ĐA GIÁC (POLYGONS)
zones:
  # --- Tọa độ Camera thực tế ---
  mold: [[0.364, 0.706], [0.545, 0.517], [0.694, 0.781], [0.475, 1.0], [0.475, 1.0]]
  # Nới rộng vùng nút bấm button_right để công nhân bấm là nhận ngay
  button_right: [[0.205, 0.700], [0.300, 0.670], [0.325, 0.795], [0.220, 0.825]]
  middle_table: [[0.345, 0.456], [0.452, 0.378], [0.486, 0.439], [0.377, 0.528]]
  # Vùng tham chiếu để chọn 2 tay gần nhất (bao quanh mold + middle_table)
  work_area: [[0.164, 0.519], [0.589, 0.231], [0.97, 0.572], [0.389, 0.978]]
# QUY TRÌNH SOP CHI TIẾT (5 BƯỚC MỚI)
steps:
  # Bước 1: Robot lấy 2 sản phẩm ra khỏi khuôn
  # Hoàn thành khi: robot ở trong mold + mold không còn sản phẩm
  - step_order: 1
    step_name: "Robot lấy 2 SP từ khuôn"
    logic: "robot_and_zone_absent"
    required_zone: "mold"
    require_robot: true
    require_product_absent: true
    min_dwell_sec: 0.3

  # Bước 2: Công nhân thò 2 tay vào lấy 2 slider từ khuôn ra bàn giữa
  # Chỉ lấy 2 tay gần work_area nhất
  - step_order: 2
    step_name: "Tay lấy 2 Slider từ khuôn"
    logic: "multi_trigger"
    required_zone: "mold"
    active_hand: "nearest_2"
    required_count: 2
    min_dwell_sec: 0.3

  # Bước 3: Lắp terminal vào slider
  # Chỉ lấy 2 tay gần work_area nhất
  - step_order: 3
    step_name: "Lắp Terminal vào Slider"
    logic: "multi_trigger"
    required_zone: "middle_table"
    active_hand: "nearest_2"
    required_count: 2
    min_dwell_sec: 2.0

  # Bước 4: Đưa 2 slider vào khuôn
  # Chỉ lấy 2 tay gần work_area nhất
  - step_order: 4
    step_name: "Đưa 2 Slider vào khuôn"
    logic: "multi_trigger"
    required_zone: "mold"
    active_hand: "nearest_2"
    required_count: 2
    min_dwell_sec: 0.3

  # Bước 5: Bấm nút bên phải → hoàn thành 1 chu kì
  - step_order: 5
    step_name: "Bấm nút bên phải"
    logic: "zone_trigger"
    required_zone: "button_right"
    active_hand: "any"
    min_dwell_sec: 0.0

config:
  violation_tolerance: 8
  idle_timeout_frames: 120
  transition_timeout_sec: 9999.0
  min_step_dwell_sec: 0.3
  restart_allowed_until_step: 2  # Cho phép reset tự động đến bước 2
  downtime_threshold_sec: 300.0  # Robot chưa hoàn thành bước 1 sau 5 phút tính là dừng máy

station_id: "07"
station_name: "Station 07 - Máy 7 (TFF4040)"

# ĐỊNH NGHĨA CÁC VÙNG ĐA GIÁC (POLYGONS)
zones:
  # --- Tọa độ Camera thực tế ---
  mold: [[0.441, 0.735], [0.616, 0.592], [0.738, 0.854], [0.52, 0.948]]
  button_right: [[0.341, 0.689], [0.283, 0.714], [0.301, 0.799], [0.367, 0.771]]
  middle_table: [[0.471, 0.594], [0.606, 0.5], [0.572, 0.414], [0.445, 0.485]]
  # Vùng tham chiếu để chọn 2 tay gần nhất (bao quanh mold + middle_table)
  work_area: [[0.38, 0.935], [0.963, 0.711], [0.684, 0.253], [0.23, 0.546]]
# QUY TRÌNH SOP CHI TIẾT (5 BƯỚC MỚI)
steps:
  # Bước 1: Robot lấy 2 sản phẩm ra khỏi khuôn
  # Hoàn thành khi: robot ở trong mold + mold không còn sản phẩm
  - step_order: 1
    step_name: "Robot lấy 2 SP từ khuôn"
    logic: "robot_and_zone_absent"
    required_zone: "mold"
    require_robot: true
    require_product_absent: true
    min_dwell_sec: 0.3

  # Bước 2: Công nhân thò 2 tay vào lấy 2 slider từ khuôn ra bàn giữa
  # Chỉ lấy 2 tay gần work_area nhất
  - step_order: 2
    step_name: "Tay lấy 2 Slider từ khuôn"
    logic: "multi_trigger"
    required_zone: "mold"
    active_hand: "nearest_2"
    required_count: 2
    min_dwell_sec: 0.3

  # Bước 3: Lắp terminal vào slider
  # Chỉ lấy 2 tay gần work_area nhất
  - step_order: 3
    step_name: "Lắp Terminal vào Slider"
    logic: "multi_trigger"
    required_zone: "middle_table"
    active_hand: "nearest_2"
    required_count: 2
    min_dwell_sec: 2.0

  # Bước 4: Đưa 2 slider vào khuôn
  # Chỉ lấy 2 tay gần work_area nhất
  - step_order: 4
    step_name: "Đưa 2 Slider vào khuôn"
    logic: "multi_trigger"
    required_zone: "mold"
    active_hand: "nearest_2"
    required_count: 2
    min_dwell_sec: 0.3

  # Bước 5: Bấm nút bên phải → hoàn thành 1 chu kì
  - step_order: 5
    step_name: "Bấm nút bên phải"
    logic: "zone_trigger"
    required_zone: "button_right"
    active_hand: "any"
    min_dwell_sec: 0.0

config:
  violation_tolerance: 8
  idle_timeout_frames: 120
  transition_timeout_sec: 9999.0
  min_step_dwell_sec: 0.3
  restart_allowed_until_step: 2  # Cho phép reset tự động đến bước 2
  downtime_threshold_sec: 300.0  # Robot chưa hoàn thành bước 1 sau 5 phút tính là dừng máy

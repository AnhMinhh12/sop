station_id: "04"
station_name: "Station 04 - Máy 4 (639957)"

# ĐỊNH NGHĨA CÁC VÙNG ĐA GIÁC (POLYGONS)
zones:
  mold: [[0.552, 0.519], [0.43, 0.736], [0.622, 0.964], [0.753, 0.683]]
  # Bàn giữa (hộp chứa terminal ở giữa)
  middle_table: [[0.239, 0.544], [0.412, 0.278], [0.502, 0.389], [0.336, 0.678]]
  # Nút bấm bên trái (góc trên bên phải bàn thao tác theo góc nhìn công nhân)
  button_left: [[0.477, 0.325], [0.534, 0.258], [0.581, 0.292], [0.503, 0.375]]
  # Nút bấm bên phải (góc dưới bên trái bàn thao tác theo góc nhìn công nhân)
  button_right: [[0.255, 0.686], [0.211, 0.847], [0.263, 0.867], [0.311, 0.7]]
  # Vùng tham chiếu để chọn 2 tay gần nhất (bao quanh mold + middle_table)
  work_area: [[0.017, 0.561], [0.519, 0.022], [0.964, 0.436], [0.506, 0.983]]

# QUY TRÌNH SOP CHI TIẾT (3 BƯỚC CHO MÃ HÀNG 639957)
steps:
  # Bước 1: Lấy sản phẩm ra khỏi khuôn
  - step_order: 1
    step_name: "Lấy sản phẩm ra khỏi khuôn"
    logic: "zone_trigger"
    active_hand: "any"
    required_zone: "mold"
    min_dwell_sec: 0.3

  # Bước 2: Lắp 4 terminal từ bàn giữa vào khuôn
  - step_order: 2
    step_name: "Lắp 4 terminal từ bàn giữa vào khuôn"
    logic: "multi_trigger"
    active_hand: "any"
    required_zone: "mold"
    required_count: 4
    min_dwell_sec: 0.2

  # Bước 3: 2 tay đồng thời bấm 2 nút
  - step_order: 3
    step_name: "2 tay đồng thời bấm 2 nút"
    logic: "dual_task"
    left_zone: "button_left"
    right_zone: "button_right"
    min_dwell_sec: 0.2

config:
  violation_tolerance: 8
  idle_timeout_frames: 120
  transition_timeout_sec: 35.0
  min_step_dwell_sec: 0.2
  restart_allowed_until_step: 1
  max_cycle_time_sec: 35.0

server:
  host: "0.0.0.0"
  port: 5001
  debug: false
  secret_key: "default-secret-key-change-me"

hub:
  mode: "full"  # "full" = AI local, "aggregator" = edge-only (no AI on Hub)
  api_key: "change-me-in-production"  # Edge authentication token
  frame_cache_ttl_sec: 10  # Max seconds before marking edge as offline

products:
  - id: "TFF4040"
    name: "TFF4040"
    sop_file: "projects/sop_monitoring/config/TFF4040.yaml"
  - id: "626287"
    name: "626287"
    sop_file: "projects/sop_monitoring/config/626287.yaml"
  - id: "laprap"
    name: "laprap"
    sop_file: "projects/sop_monitoring/config/laprap.yaml"

inference:
  device: "cpu"
  model_format: "onnx"
  num_threads: 4          # 4 threads cho AI trên Intel Xeon
  max_concurrent_inference: 1  # Serialize qua lock, không cần nhiều hơn 1

models:
  yolo:
    weights: "shared/models/yolo/laprap.onnx"
    input_size: 416
    fps_cap: 15
    conf_threshold: 0.35
    iou_threshold: 0.4516

cameras:
  - id: "machine_07"
    name: "Máy 7"
    illustration: "/static/illustration/may_7.png"
    rtsp_url: "rtsp://admin:Htmp%402019@10.0.7.47:554/Streaming/Channels/102"
    #rtsp_url: "data/recordings/08_08_20260808_113003_3min.mp4"
    #rtsp_url: "shared/tools/data/raw/07_08.mp4"
    sop_file: "projects/sop_monitoring/config/TFF4040.yaml"
    engine_id: "TFF4040"
    yolo_model: "shared/models/yolo/TFF4040_final.onnx"
    resolution: [640, 480]
    fps_cap: 15
    conf_threshold: 0.35

  - id: "machine_08"
    name: "Máy 8"
    illustration: "/static/illustration/may_8.png"
    rtsp_url: "rtsp://admin:Htmp%402019@192.168.103.18:554/Streaming/Channels/101"
    sop_file: "projects/sop_monitoring/config/laprap.yaml"
    engine_id: "laprap"
    yolo_model: "" # Không chạy AI cục bộ tại Hub
    resolution: [640, 480]
    fps_cap: 15
    is_external: true # Nhận frame push trực tiếp từ máy trạm con qua HTTP API

alerts:
  audio:
    enabled: true
    sound_file: "shared/assets/sounds/alert.wav"
    volume: 0.8
    cooldown_sec: 10

storage:
  violations_dir: "data/violations/"
  clip_pre_seconds: 10
  clip_post_seconds: 5
  max_disk_usage_percent: 85
  min_free_gb: 50
  retention_days: 30  # Lưu video trong vòng 30 ngày (1 tháng)

logging:
  level: "INFO"
  log_file: "data/logs/system.log"
  max_log_mb: 100

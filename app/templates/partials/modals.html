<div id="toast-container" class="fixed top-20 right-6 z-50 flex flex-col gap-3"></div>

<!-- Video Replay Modal -->
<div id="video-modal" class="fixed inset-0 z-[9999] flex items-center justify-center pointer-events-none transition-all duration-500" style="visibility: hidden;">
    <!-- Backdrop với độ mờ cao - Bấm vào đây để đóng -->
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-md opacity-0 transition-opacity duration-500 cursor-pointer" id="modal-backdrop" onclick="closeModal()"></div>
    
    <!-- Modal Content -->
    <div class="bg-white/90 backdrop-blur-xl rounded-[2rem] shadow-[0_32px_64px_-12px_rgba(0,0,0,0.2)] overflow-hidden w-full max-w-4xl transform scale-90 opacity-0 transition-all duration-500 mx-4 border border-white/40" id="modal-content">
        
        <!-- Header -->
        <div class="px-8 py-6 flex justify-between items-center border-b border-slate-100/50">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div>
                    <h3 id="modal-title" class="text-xl font-black text-slate-800 tracking-tight">XEM LẠI VI PHẠM</h3>
                    <p id="modal-subtitle" class="text-xs text-slate-500 font-bold uppercase tracking-widest mt-0.5">SOP Monitoring System</p>
                </div>
            </div>
            <button class="w-10 h-10 rounded-full flex items-center justify-center text-slate-400 hover:text-danger hover:bg-red-50 transition-all duration-300" onclick="closeModal()">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <!-- Video Area -->
        <div class="p-2 bg-slate-50">
            <div class="relative bg-black rounded-3xl overflow-hidden shadow-[inset_0_2px_10px_rgba(0,0,0,0.5)] ring-1 ring-black/5 flex items-center justify-center min-h-[300px]">
                <video id="replay-video" controls autoplay muted playsinline class="max-w-full max-h-[75vh] z-0">
                    <source id="video-source" src="" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                
                <!-- Custom Loading Spinner -->
                <div id="video-loader" class="absolute inset-0 flex items-center justify-center bg-slate-900/20 backdrop-blur-sm z-10 hidden">
                    <div class="w-12 h-12 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="px-8 py-6 bg-slate-50/50 flex justify-between items-center">
            <div class="flex items-center gap-2 text-slate-400 text-sm font-medium">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>Hỗ trợ tua và tải video trực tiếp</span>
            </div>
            <div class="flex items-center gap-4">
                <a id="download-link" href="#" target="_blank" class="px-6 py-2.5 text-slate-600 hover:text-primary font-bold transition-all text-sm flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Tải video
                </a>
                <button onclick="closeModal()" class="px-8 py-3 bg-primary text-white rounded-2xl hover:bg-blue-700 transition-all font-bold text-sm shadow-xl shadow-primary/25 active:scale-95">
                    Đóng cửa sổ
                </button>
            </div>
        </div>
    </div>
</div>

<style>
    #video-modal .bg-surface {
        background: #ffffff;
    }
    .video-feed-glow {
        box-shadow: 0 0 40px rgba(37, 99, 235, 0.1);
    }
</style>

<script>
    function closeModal() {
        const modal = document.getElementById('video-modal');
        const backdrop = document.getElementById('modal-backdrop');
        const content = document.getElementById('modal-content');
        const video = document.getElementById('replay-video');
        
        if(video) video.pause();
        
        // Hiệu ứng đóng
        backdrop.style.opacity = '0';
        content.style.opacity = '0';
        content.style.transform = 'scale(0.9) translateY(20px)';
        
        setTimeout(() => {
            modal.style.visibility = 'hidden';
            modal.classList.add('pointer-events-none');
        }, 500);
    }

    function openVideo(id, station, type) {
        const modal = document.getElementById('video-modal');
        const backdrop = document.getElementById('modal-backdrop');
        const content = document.getElementById('modal-content');
        const video = document.getElementById('replay-video');
        const source = document.getElementById('video-source');
        const title = document.getElementById('modal-title');
        const download = document.getElementById('download-link');
        const loader = document.getElementById('video-loader');

        // Set content
        title.innerText = type;
        document.getElementById('modal-subtitle').innerText = `Trạm: ${station} • Violation Replay`;
        source.src = `/clip/${id}`;
        download.href = `/clip/${id}`;
        
        // Load video
        loader.classList.remove('hidden');
        video.load();
        
        video.oncanplay = () => {
            loader.classList.add('hidden');
        };

        // Show modal
        modal.style.visibility = 'visible';
        modal.classList.remove('pointer-events-none');
        
        // Trigger animations
        setTimeout(() => {
            backdrop.style.opacity = '1';
            content.style.opacity = '1';
            content.style.transform = 'scale(1) translateY(0)';
        }, 10);
    }
</script>

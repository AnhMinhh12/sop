<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SOP AI MONITORING - HTMP SYSTEMS{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Removed Google Fonts for Offline Environment -->
    <script src="{{ url_for('static', filename='js/socket.io.min.js') }}"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <header>
        <div class="logo-container">
            <h1>SOP AI <span>MONITORING</span></h1>
        </div>

        <nav class="nav-tabs">
            <a href="#" id="hub-link" class="nav-link" style="background: rgba(255,255,255,0.1); border-radius: 4px; margin-right: 15px; display: flex; align-items: center; gap: 8px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                Hub
            </a>
            <script>
                // Tự động nhận diện IP để quay về Hub cổng 4000
                document.getElementById('hub-link').href = "http://" + window.location.hostname + ":4000/";
            </script>
            <a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">Dashboard</a>
            <a href="/history" class="nav-link {% if request.path == '/history' %}active{% endif %}">Lịch sử</a>
            <a href="/stats" class="nav-link {% if request.path == '/stats' %}active{% endif %}">Thống kê</a>
        </nav>

        <div class="system-stats-compact">
            <div class="stat-item">
                <span class="stat-label">CPU</span>
                <span id="cpu-val" class="stat-value">--</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">RAM</span>
                <span id="ram-val" class="stat-value">--</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">DISK</span>
                <span id="disk-val" class="stat-value">--</span>
            </div>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Global Components -->
    <div id="toast-container" class="toast-container"></div>

    <div id="video-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Replay Violation</h3>
                <div class="modal-close" onclick="closeModal()">×</div>
            </div>
            <video id="replay-video" controls autoplay>
                Your browser does not support the video tag.
            </video>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
